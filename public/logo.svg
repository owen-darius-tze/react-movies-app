<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MicroFilm">
  <!-- Film-aperture mark: a navy rounded tile containing a white film frame
       with two sprocket strips and a circular aperture, evoking a movie frame. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1F3A68"/>
  <!-- left sprocket strip -->
  <g fill="#FFFFFF">
    <rect x="11" y="10" width="6" height="5" rx="1"/>
    <rect x="11" y="20" width="6" height="5" rx="1"/>
    <rect x="11" y="30" width="6" height="5" rx="1"/>
    <rect x="11" y="40" width="6" height="5" rx="1"/>
    <rect x="11" y="50" width="6" height="4" rx="1"/>
  </g>
  <!-- right sprocket strip -->
  <g fill="#FFFFFF">
    <rect x="47" y="10" width="6" height="5" rx="1"/>
    <rect x="47" y="20" width="6" height="5" rx="1"/>
    <rect x="47" y="30" width="6" height="5" rx="1"/>
    <rect x="47" y="40" width="6" height="5" rx="1"/>
    <rect x="47" y="50" width="6" height="4" rx="1"/>
  </g>
  <!-- film frame center + aperture hole -->
  <rect x="20" y="14" width="24" height="36" rx="3" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="7" fill="#1F3A68"/>
</svg>
